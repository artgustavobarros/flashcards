# Dev only: Postgres for apps/api. Production compose lives elsewhere.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daruma
      POSTGRES_PASSWORD: daruma
      POSTGRES_DB: daruma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daruma -d daruma"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
