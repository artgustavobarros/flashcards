const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const plain = (h) => { const d = document.createElement('div'); d.innerHTML = h.replace(/<pre>/g, ' <pre>'); return d.textContent.replace(/\s+/g, ' ').trim(); };
const semAcento = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const deckOf = (id) => DECKS.find((d) => d.id === id);
const labelOf = (id) => LABELS.find((l) => l.id === id);

const isHoje = (c) => c.due !== null && c.due <= 0;
function counts(deckId) {

  return { total: cs.length, novos: cs.filter((c) => c.st === 'novo').length, hoje: cs.filter(isHoje).length };
}

// busca: pergunta, resposta e Comments, sem acento. Devolve onde achou.
function matchOf(c, q) {
  if (!q) return { where: null };
  const k = semAcento(q.trim());
  if (!k) return { where: null };
  if (semAcento(plain(c.q)).includes(k)) return { where: 'q' };
  if (semAcento(plain(c.a)).includes(k)) return { where: 'a', text: plain(c.a) };
  const m = c.cm.find((x) => semAcento(x.txt).includes(k));
  return m ? { where: 'c', text: m.txt } : null;
}
// destaca o termo sem acento: cada caractere vira 1 caractere ao tirar o acento
function hl(text, q) {
  const k = semAcento((q || '').trim());
  if (!k) return esc(text);
  const norm = [...text].map((ch) => semAcento(ch) || ch).join('');
  if (norm.length !== text.length) return esc(text);
  let out = '', i = 0, j;
  while ((j = norm.indexOf(k, i)) !== -1) { out += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + k.length)) + '</mark>'; i = j + k.length; }
  return out + esc(text.slice(i));
}
function snippet(text, q) {
  const j = semAcento(text).indexOf(semAcento(q.trim()));
  if (j < 0) return esc(text);
  const a = Math.max(0, j - 14), b = Math.min(text.length, j + q.length + 60);
  return (a ? '…' : '') + hl(text.slice(a, b), q) + (b < text.length ? '…' : '');
}

}

/* ---------- diálogos: centrados no desktop, folha no mobile ---------- */
const sheet = (inner, wide = false) => `
  <div class="fixed inset-0 z-[60] flex items-end sm:items-center sm:justify-center sm:p-4">
    <div class="absolute inset-0 bg-black/40" data-act="mclose"></div>
    <div data-keep role="dialog" aria-modal="true" class="relative flex max-h-[85dvh] w-full flex-col rounded-t-xl border bg-popover pb-[env(safe-area-inset-bottom)] text-popover-foreground shadow-pop sm:rounded-xl ${wide ? 'sm:max-w-lg' : 'sm:max-w-md'}">
      <div class="mx-auto mt-2 h-1 w-10 rounded-full bg-border sm:hidden"></div>
      ${inner}
    </div>
  </div>`;
const sheetHead = (title, sub = '') => `
  <div class="flex items-start gap-3 px-5 pb-3 pt-4">
    <div class="min-w-0 flex-1"><h2 class="font-display text-lg font-semibold">${title}</h2>${sub ? `<p class="text-sm text-muted-foreground">${sub}</p>` : ''}</div>
    <button data-act="mclose" class="${btn('ghost', 'iconsm', '-mr-2')}" aria-label="Fechar">${ic('x', 'h-4 w-4')}</button>
  </div>`;
const quem = (ids) => ids.length === 1 ? 'este Card' : `${n(ids.length)} Cards`;
function modal() {
  const M = S.modal;
  if (!M) return '';
  if (M.kind === 'mover') {
    const cur = new Set(M.ids.map((id) => cardOf(id).deck));
    const rows = DECKS.filter((d) => !S.mq || semAcento(d.n).includes(semAcento(S.mq)));
    return sheet(sheetHead('Mover para Deck', `Mover ${quem(M.ids)}. O agendamento não muda.`) + `
      <div class="px-5"><input data-mq data-fkey="mq" class="${INPUT} rounded-btn px-4" placeholder="Buscar Deck…" value="${esc(S.mq)}" aria-label="Buscar Deck"></div>
      <div class="mt-2 overflow-y-auto px-3 pb-4">${rows.map((d) => {
        const here = cur.size === 1 && cur.has(d.id);
        return `<button data-act="mv:${d.id}" ${here ? 'disabled' : ''} class="flex w-full items-center gap-3 rounded-md px-2.5 py-2.5 text-left hover:bg-accent disabled:opacity-60">
          <span class="grid h-8 w-8 place-items-center rounded-full bg-primary/10 text-primary">${ic('layers', 'h-4 w-4')}</span>
          <span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">${esc(d.n)}</span><span class="block text-xs text-muted-foreground">${here ? 'Deck atual' : plural(counts(d.id).total, 'card', 'cards')}</span></span>
        </button>`; }).join('') || '<p class="py-6 text-center text-sm text-muted-foreground">Nenhum Deck encontrado.</p>'}</div>`);
  }
  if (M.kind === 'labels') {
    const cs = M.ids.map(cardOf);
    const q = S.mq.trim();
    const rows = LABELS.filter((l) => !q || semAcento(l.n).includes(semAcento(q)));
    const exact = LABELS.some((l) => semAcento(l.n) === semAcento(q));
    return sheet(sheetHead('Labels', M.ids.length === 1 ? 'Marque as Labels deste Card.' : `Para ${quem(M.ids)}. O traço indica que só alguns têm a Label.`) + `
      <div class="px-5"><input data-mq data-fkey="mq" class="${INPUT} rounded-btn px-4" placeholder="Buscar ou criar Label…" value="${esc(S.mq)}" aria-label="Buscar ou criar Label"></div>
      <div class="mt-2 overflow-y-auto px-3">
        ${rows.map((l) => { const k = cs.filter((c) => c.labels.includes(l.id)).length; return `
          <div class="flex items-center gap-3 rounded-md px-2.5 py-2 hover:bg-accent">
            ${checkbox(k === cs.length, 'lb:' + l.id, l.n, '', k > 0 && k < cs.length)}
            <button data-act="lb:${l.id}" class="flex-1 text-left text-sm">${esc(l.n)}</button>
            <span class="text-xs text-muted-foreground tnum">${labelCount(l.id)}</span>
          </div>`; }).join('')}
        ${q && !exact ? `<button data-act="lbnew" class="flex w-full items-center gap-3 rounded-md px-2.5 py-2 text-left text-sm text-primary hover:bg-accent">${ic('plus', 'h-4 w-4')}Criar Label “${esc(q)}”</button>` : ''}
        ${!rows.length && !q ? '<p class="py-6 text-center text-sm text-muted-foreground">Nenhuma Label ainda. Digite um nome para criar.</p>' : ''}
      </div>
      <div class="flex justify-end border-t px-5 py-3 mt-2"><button data-act="mclose" class="${btn('primary', 'md')}">Pronto</button></div>`);
  }
  if (M.kind === 'confirm') {
    return sheet(`
      <div class="p-6">
        <h2 class="font-display text-lg font-semibold">${M.title}</h2>
        <p class="mt-2 text-sm text-muted-foreground">${M.body}</p>
        <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button data-act="mclose" class="${btn('outline')}">Cancelar</button>
          <button data-act="${M.ok}" class="${btn('destructive')}">${M.okLabel}</button>
        </div>
      </div>`);
  }
  if (M.kind === 'rename-deck') {
    return sheet(sheetHead('Renomear Deck') + `
      <form data-form="rename-deck" class="px-5 pb-5">
        <input data-mq data-fkey="mq" class="${INPUT}" value="${esc(S.mq)}" aria-label="Nome do Deck">
        <div class="mt-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button type="button" data-act="mclose" class="${btn('outline')}">Cancelar</button><button class="${btn('primary')}" ${S.mq.trim() ? '' : 'disabled'}>Salvar</button>
        </div>
      </form>`);
  }
  return '';
}

/* ---------- toasts ---------- */
function toasts() {

const snap = () => JSON.stringify({ CARDS, DECKS, LABELS });

/* ---------- barra do protótipo (fora do design) ---------- */
const GOTO = {

function switcher() {

/* ---------- render ---------- */
function screen() {
  return varA() + cabecalho.novoSheet(ic, S.open === 'novo-sheet') + modal() + toasts();
}
function render() {
  document.documentElement.classList.toggle('dark', S.tema === 'escuro');
  const app = document.getElementById('app');
  if (S.frame === 'mobile' && !S.embed) {
    const src = '?' + params({ embed: '1' });
    const frame = app.querySelector('iframe');
    if (!frame || frame.dataset.src !== src) app.innerHTML = `
      <div class="grid min-h-screen place-items-center bg-muted p-6 pb-24">
        <iframe data-src="${src}" src="${src}" title="Mobile 390px" class="h-[844px] max-h-[calc(100vh-7rem)] w-[390px] rounded-[2.25rem] border-[10px] border-neutral-900 bg-background shadow-2xl"></iframe>
      </div>`;
  } else {
    app.innerHTML = screen();
    // mantém o foco no campo que estava sendo digitado
    if (S.focusKey) {
      const el = app.querySelector(`[data-fkey="${S.focusKey}"]`);
      if (el) { el.focus({ preventScroll: true }); if (S.focusPos != null && el.setSelectionRange) el.setSelectionRange(S.focusPos, S.focusPos); }
    }
  }
  document.getElementById('switcher').innerHTML = S.embed ? '' : switcher();
}
function go(patch) {
  Object.assign(S, { cardId: null, sel: [], selMode: false, open: null, labelsPage: false, modal: null, editIdx: null }, patch);
  syncURL();
}
function resetFilters() { S.f = { deck: null, label: null, estado: null, hoje: false }; }
function openModal(kind, extra = {}) { S.modal = { kind, ...extra }; S.mq = extra.mq || ''; S.open = null; S.focusKey = null; }
const leave = (url) => { location.href = url + (url.includes('?') ? '&' : '?') + `tema=${S.tema}${S.embed ? '&embed=1' : ''}`; };

/* ---------- ações ---------- */
function act(k, arg, el) {
  switch (k) {
    case 'tema': S.tema = S.tema === 'escuro' ? 'claro' : 'escuro'; syncURL(); break;
    case 'frame': S.frame = S.frame === 'mobile' ? 'desktop' : 'mobile'; syncURL(); break;
    case 'toggle': { const key = el.dataset.act.slice(7); S.open = S.open === key ? null : key; if (key === 'bell') S.bellSeen = true; break; }
    case 'close': S.open = null; break;
    case 'nav':
      if (arg === 'inicio') return leave('home.html');
      if (arg === 'progresso') return leave('progresso.html');
      if (arg === 'decks') { resetFilters(); S.q = ''; go({ tela: 'decks', deckId: null }); break; }
      return leave('configuracoes.html');
    case 'reenviar': toast('Enviamos um novo link para ana@exemplo.com.'); break;
    case 'tab': resetFilters(); go({ tela: arg, deckId: null }); break;
    case 'deck': resetFilters(); go({ tela: 'deck', deckId: arg }); scrollTo({ top: 0 }); break;
    case 'card': S.cardId = arg; S.draft = ''; S.editIdx = null; S.open = null; syncURL(); scrollTo({ top: 0 }); break;
    case 'back':
      if (S.cardId) { S.cardId = null; syncURL(); break; }
      if (S.labelsPage) { S.labelsPage = false; break; }
      if (S.tela === 'deck') { resetFilters(); go({ tela: 'decks', deckId: null }); }
      break;
    case 'qclear': S.q = ''; S.focusKey = null; syncURL(); break;
    case 'fdeck': S.f.deck = arg || null; S.open = null; S.sel = []; break;
    case 'flabel': S.f.label = arg || null; S.open = null; S.sel = []; break;
    case 'festado': S.f.estado = arg || null; S.open = null; S.sel = []; break;
    case 'fhoje': S.f.hoje = !S.f.hoje; S.open = null; S.sel = []; break;
    case 'flimpar': resetFilters(); S.q = ''; S.sel = []; syncURL(); break;
    case 'sel': S.sel = S.sel.includes(arg) ? S.sel.filter((x) => x !== arg) : S.sel.concat(arg); break;
    case 'selall': { const ids = list().map((x) => x.c.id); S.sel = ids.every((id) => S.sel.includes(id)) ? [] : ids; break; }
    case 'selclear': S.sel = []; S.selMode = false; break;
    case 'selmode': S.selMode = true; break;
    case 'bulk':
      if (arg === 'mover') openModal('mover', { ids: S.sel.slice() });
      if (arg === 'labels') openModal('labels', { ids: S.sel.slice() });
      if (arg === 'apagar') openModal('confirm', { ids: S.sel.slice(), title: `Apagar ${plural(S.sel.length, 'Card', 'Cards')}?`, body: 'Os Comments e o histórico de Ratings desses Cards também somem.', ok: 'ok-apagar', okLabel: 'Apagar' });
      break;
    case 'cmover': openModal('mover', { ids: [S.cardId] }); break;
    case 'clabels': openModal('labels', { ids: [S.cardId] }); break;
    case 'capagar': openModal('confirm', { ids: [S.cardId], title: 'Apagar este Card?', body: 'Os Comments e o histórico de Ratings dele também somem.', ok: 'ok-apagar', okLabel: 'Apagar Card' }); break;
    case 'mclose': S.modal = null; S.mq = ''; S.focusKey = null; break;
    case 'mv': {
      const s = snap(), ids = S.modal.ids;
      ids.forEach((id) => { cardOf(id).deck = arg; });
      S.modal = null; S.sel = []; S.selMode = false;
      toast(`${ids.length === 1 ? 'Card movido' : plural(ids.length, 'Card movido', 'Cards movidos')} para ${esc(deckOf(arg).n)}.`, s);
      break;
    }
    case 'lb': {
      const cs = S.modal.ids.map(cardOf), all = cs.every((c) => c.labels.includes(arg));
      cs.forEach((c) => { c.labels = all ? c.labels.filter((l) => l !== arg) : c.labels.includes(arg) ? c.labels : c.labels.concat(arg); });
      break;
    }
    case 'lbnew': {
      const nm = S.mq.trim(), id = 'l' + Date.now();
      LABELS.push({ id, n: nm });
      S.modal.ids.map(cardOf).forEach((c) => c.labels.push(id));
      S.mq = ''; toast(`Label “${esc(nm)}” criada.`);
      break;
    }
    case 'ok-apagar': {
      const s = snap(), ids = S.modal.ids;
      CARDS = CARDS.filter((c) => !ids.includes(c.id));
      if (ids.includes(S.cardId)) S.cardId = null;
      S.modal = null; S.sel = []; S.selMode = false; syncURL();
      toast(ids.length === 1 ? 'Card apagado.' : `${plural(ids.length, 'Card apagado', 'Cards apagados')}.`, s);
      break;
    }
    case 'deck-renomear': openModal('rename-deck', { mq: deckOf(S.deckId).n }); S.focusKey = 'mq'; break;
    case 'deck-apagar': {
      const k = counts(S.deckId).total;
      openModal('confirm', { title: `Apagar “${esc(deckOf(S.deckId).n)}”?`, body: k ? `Os ${plural(k, 'Card', 'Cards')} deste Deck também são apagados, com os Comments e o histórico. Para guardar algum, mova antes para outro Deck.` : 'O Deck está vazio.', ok: 'ok-apagar-deck', okLabel: 'Apagar Deck' });
      break;
    }
    case 'ok-apagar-deck': {
      const s = snap(), d = deckOf(S.deckId);
      CARDS = CARDS.filter((c) => c.deck !== d.id); DECKS = DECKS.filter((x) => x.id !== d.id);
      resetFilters(); go({ tela: 'decks', deckId: null });
      toast(`Deck “${esc(d.n)}” apagado.`, s);
      break;
    }
    case 'labels-page': S.labelsPage = true; S.open = null; S.mq = ''; S.rn = null; scrollTo({ top: 0 }); break;
    case 'lrn': S.rn = arg; S.rnTxt = labelOf(arg).n; S.focusKey = 'rn-' + arg; S.focusPos = S.rnTxt.length; break;
    case 'lrn-cancel': S.rn = null; S.focusKey = null; break;
    case 'ldel': {
      const l = labelOf(arg), k = labelCount(arg);
      openModal('confirm', { title: `Apagar a Label “${esc(l.n)}”?`, body: k ? `Ela sai de ${plural(k, 'Card', 'Cards')}. Os Cards continuam onde estão.` : 'Nenhum Card usa esta Label.', ok: 'ok-ldel:' + arg, okLabel: 'Apagar Label' });
      break;
    }
    case 'ok-ldel': {
      const s = snap(), l = labelOf(arg);
      LABELS = LABELS.filter((x) => x.id !== arg); CARDS.forEach((c) => { c.labels = c.labels.filter((x) => x !== arg); });
      if (S.f.label === arg) S.f.label = null;
      S.modal = null;
      toast(`Label “${esc(l.n)}” apagada.`, s);
      break;
    }
    case 'cedit': S.editIdx = Number(arg); S.editTxt = cardOf(S.cardId).cm[S.editIdx].txt; S.focusKey = 'cm-edit'; S.focusPos = S.editTxt.length; break;
    case 'cedit-cancel': S.editIdx = null; S.focusKey = null; break;
    case 'cdel': { const s = snap(); cardOf(S.cardId).cm.splice(Number(arg), 1); S.editIdx = null; toast('Comment apagado.', s); break; }
    case 'undo': {
      const t = S.toasts.find((x) => x.id == arg);
      if (t) { const o = JSON.parse(t.undo); CARDS = o.CARDS; DECKS = o.DECKS; LABELS = o.LABELS; }
      S.toasts = S.toasts.filter((x) => x.id != arg);
      if (S.deckId && !deckOf(S.deckId)) S.deckId = null;
      break;
    }
    case 'toast-close': S.toasts = S.toasts.filter((x) => x.id != arg); break;
    case 'estudar': return leave(`study-session.html?origem=deck&deck=${S.deckId}`);
    case 'adicionar': return leave('editor-de-card.html?tela=lote');
    case 'novo-deck': return leave('editor-de-card.html?tela=novo-deck');
    case 'creiniciar': {
      // Schedule Reset: sem diálogo; zera o agendamento e o Card entra no fim da fila de New Cards
      const s = snap(), c = cardOf(S.cardId);
      Object.assign(c, { st: 'novo', due: null, reset: '21 out' });
      S.open = null;
      toast('Agendamento reiniciado.', s);
      break;
    }
    case 'editar': {
      const c = cardOf(S.cardId), p = params(); p.delete('tema');
      store.set('daruma:editar', { id: c.id, q: c.q, a: c.a, labels: c.labels.map((l) => labelOf(l).n), deck: deckOf(c.deck).n, rated: c.st !== 'novo', volta: 'decks.html?' + p });
      return leave('editor-de-card.html?tela=editar&de=card');
    }
    case 'ver-progresso': return leave(`progresso.html?deck=${S.deckId}`);
  }
  return true;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (S.open && !e.target.closest('[data-keep]')) { S.open = null; render(); }
    if (!e.target.closest('input, textarea')) S.focusKey = null;
    return;
  }
  if (el.disabled) return;
  const a = el.dataset.act, i = a.indexOf(':');
  const k = i < 0 ? a : a.slice(0, i), arg = i < 0 ? '' : a.slice(i + 1);
  if (!['lrn', 'cedit', 'deck-renomear'].includes(k)) S.focusKey = null;
  if (act(k, arg, el)) render();
});

document.addEventListener('focusin', (e) => {
  const k = e.target.dataset && e.target.dataset.fkey;
  if (k) S.focusKey = k;
});
document.addEventListener('input', (e) => {
  const t = e.target;
  S.focusKey = t.dataset.fkey || null; S.focusPos = t.selectionStart;
  if (t.matches('[data-q]')) { S.q = t.value; S.sel = []; syncURL(); render(); }
  else if (t.matches('[data-mq]')) { S.mq = t.value; render(); }
  else if (t.matches('[data-rn]')) { S.rnTxt = t.value; }
  else if (t.matches('[data-edit]')) { S.editTxt = t.value; }
  else if (t.matches('[data-draft]')) { const was = !!S.draft.trim(); S.draft = t.value; if (was !== !!S.draft.trim()) render(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const k = e.target.dataset.form;
  if (k === 'comment' && S.draft.trim()) {
    const now = new Date();
    cardOf(S.cardId).cm.push({ quando: `Hoje · ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`, txt: S.draft.trim() });
    S.draft = ''; toast('Comment salvo.');
  }
  if (k === 'comment-edit' && S.editTxt.trim()) { cardOf(S.cardId).cm[S.editIdx].txt = S.editTxt.trim(); S.editIdx = null; S.focusKey = null; toast('Comment salvo.'); }
  if (k === 'new-label' && S.mq.trim()) {
    const nm = S.mq.trim();
    if (LABELS.some((l) => semAcento(l.n) === semAcento(nm))) { toast(`Já existe a Label “${esc(nm)}”.`); }
    else { LABELS.unshift({ id: 'l' + Date.now(), n: nm }); S.mq = ''; toast(`Label “${esc(nm)}” criada.`); }
  }
  if (k === 'rename-label' && S.rnTxt.trim()) { labelOf(S.rn).n = S.rnTxt.trim(); S.rn = null; S.focusKey = null; toast('Label renomeada.'); }
  if (k === 'rename-deck' && S.mq.trim()) { deckOf(S.deckId).n = S.mq.trim(); S.modal = null; S.mq = ''; S.focusKey = null; toast('Deck renomeado.'); }
  render();
});
document.addEventListener('keydown', (e) => {
  // Enter salva o Comment; Shift+Enter quebra a linha
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches && e.target.matches('[data-draft]')) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (e.key === 'Escape') {
    if (S.modal) { S.modal = null; S.focusKey = null; render(); return; }
    if (S.open) { S.open = null; render(); return; }
  }
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) return;
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset.sel;
  if (k === 'goto') {
    const g = GOTO[e.target.value];
    if (!g || S.dados === 'vazio') { e.target.value = ''; return; }
    const p = g[1];
    resetFilters(); S.q = p.q || '';
    go({ tela: p.tela, deckId: p.deckId || null, cardId: p.cardId || null, sel: p.sel || [] });
    if (p.labels) S.labelsPage = true;
    render();
  }
  if (k === 'dados') {
    const p = params({ dados: e.target.value, tela: 'decks' }); p.delete('deck'); p.delete('card'); p.delete('q');
    if (S.frame === 'mobile') p.set('frame', 'mobile');
    location.search = '?' + p;
  }
});
// parâmetros inválidos caem na lista de Decks
if (S.deckId && !deckOf(S.deckId)) { S.deckId = null; S.tela = 'decks'; }
if (S.tela === 'deck' && !S.deckId) S.tela = 'decks';
if (S.cardId && !cardOf(S.cardId)) S.cardId = null;
if (P.get('salvo') === '1' && S.cardId) toast('Card salvo.');
syncURL();
render();
</script>
</body>
</html>
