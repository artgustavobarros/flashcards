<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL — ticket "Fundação visual e shell do app".
  Pergunta: como é o esqueleto visual comum a todas as telas (tokens, componentes base, shell)?
  Decisão: shell do "Papel" (navegação em pílula, botões em pílula, "+ Novo" estendido no mobile)
  com os neutros do "Zinc" e verde como cor de ação; títulos em Outfit, texto em DM Sans.
  As variantes descartadas estão no branch prototype/fundacao-visual.
  Parâmetros: ?tela=catalogo|404|404-deslogado|erro · ?tema=claro|escuro · ?frame=mobile (iframe de 390px).
  Dados falsos, nada é salvo.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fundação visual · Daruma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Outfit:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="daruma.js"></script>
<script>
  const c = (v) => `hsl(var(--${v}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          border: c('border'), input: c('input'), ring: c('ring'),
          background: c('background'), foreground: c('foreground'),
          card: { DEFAULT: c('card'), foreground: c('card-foreground') },
          popover: { DEFAULT: c('popover'), foreground: c('popover-foreground') },
          primary: { DEFAULT: c('primary'), foreground: c('primary-foreground') },
          secondary: { DEFAULT: c('secondary'), foreground: c('secondary-foreground') },
          muted: { DEFAULT: c('muted'), foreground: c('muted-foreground') },
          accent: { DEFAULT: c('accent'), foreground: c('accent-foreground') },
          destructive: { DEFAULT: c('destructive'), foreground: c('destructive-foreground') },
          success: { DEFAULT: c('success'), foreground: c('success-foreground') },
          warning: { DEFAULT: c('warning'), foreground: c('warning-foreground') },
        },
        borderRadius: {
          sm: 'calc(var(--radius) - 4px)', md: 'calc(var(--radius) - 2px)',
          lg: 'var(--radius)', xl: 'calc(var(--radius) + 4px)', btn: 'var(--radius-btn)',
        },
        fontFamily: { sans: 'var(--font-sans)', display: 'var(--font-display)', mono: 'var(--font-mono)' },
        boxShadow: { card: 'var(--shadow-card)', pop: 'var(--shadow-pop)' },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    * { @apply border-border; }
    body { @apply bg-background text-foreground font-sans antialiased; }
  }
</style>
<style>
  /* Tokens escolhidos (variante B4 · Zinc + verde): neutros do Zinc, verde como cor de ação e de sucesso */
  :root {
    --font-sans: 'DM Sans', system-ui, sans-serif; --font-display: 'Outfit', system-ui, sans-serif; --font-mono: var(--font-sans);
    --radius: .875rem; --radius-btn: 9999px;
    --shadow-card: 0 1px 2px rgb(15 23 42 / .05), 0 6px 20px -6px rgb(15 23 42 / .08);
    --shadow-pop: 0 16px 40px -12px rgb(15 23 42 / .25);
    --background: 0 0% 100%; --foreground: 240 10% 3.9%;
    --card: 0 0% 100%; --card-foreground: 240 10% 3.9%; --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%;
    --primary: 152 42% 32%; --primary-foreground: 0 0% 100%;
    --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
    --destructive: 0 72% 51%; --destructive-foreground: 0 0% 98%;
    --success: 152 42% 32%; --success-foreground: 0 0% 100%;
    --warning: 32 95% 40%; --warning-foreground: 0 0% 100%;
    --border: 240 5.9% 90%; --input: 240 5.9% 88%; --ring: 152 42% 32%;
  }
  .dark {
    --shadow-card: 0 1px 2px rgb(0 0 0 / .3); --shadow-pop: 0 16px 40px -12px rgb(0 0 0 / .7);
    --background: 240 10% 3.9%; --foreground: 0 0% 98%;
    --card: 240 8% 6%; --card-foreground: 0 0% 98%; --popover: 240 8% 7%; --popover-foreground: 0 0% 98%;
    --primary: 148 40% 55%; --primary-foreground: 240 10% 3.9%;
    --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%;
    --destructive: 0 72% 58%; --destructive-foreground: 0 0% 98%;
    --success: 148 40% 55%; --success-foreground: 240 10% 3.9%;
    --warning: 38 92% 55%; --warning-foreground: 240 10% 4%;
    --border: 240 3.7% 15.9%; --input: 240 3.7% 20%; --ring: 148 40% 55%;
  }
  .tnum { font-variant-numeric: tabular-nums; }
</style>
<style>
  /* mobile (moldura ou DevTools): a barra de rolagem do navegador desktop não ocupa largura, como num celular */
  html.embed { scrollbar-width: none; } html.embed::-webkit-scrollbar { display: none; }
  @media (max-width: 767px) { html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; } }
</style>
<script>if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');</script>
</head>
<body>
<div id="app"></div>
<div id="switcher"></div>

<script>
/* ---------- estado ---------- */
const P = new URLSearchParams(location.search);
const TELAS = { catalogo: 'Shell + catálogo', '404': '404 logado', '404-deslogado': '404 deslogado', erro: 'Erro genérico' };
const S = {
  tela: TELAS[P.get('tela')] ? P.get('tela') : 'catalogo',
  tema: P.get('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'),
  frame: P.get('frame') === 'mobile' ? 'mobile' : 'desktop',
  embed: P.get('embed') === '1',
  open: null, nav: 'inicio', tab: 'decks', sw: true, bloco: 'erro', retrying: false, toasts: [],
};
let toastId = 0;

function syncURL() {
  const p = new URLSearchParams({ tela: S.tela, tema: S.tema });
  if (S.frame === 'mobile') p.set('frame', 'mobile');
  if (S.embed) p.set('embed', '1');
  history.replaceState(null, '', '?' + p);
}

/* ---------- ícones (traços estilo lucide) ---------- */
const PATHS = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  sliders: '<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  ok: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  tag: '<path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  dots: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-14.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  phone: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
};
const ic = (n, cls = 'h-5 w-5') =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls} shrink-0" aria-hidden="true">${PATHS[n]}</svg>`;

/* ---------- componentes base ---------- */
const BTN_BASE = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-btn font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background disabled:pointer-events-none disabled:opacity-50';
const BTN_SIZE = { sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-6 text-base', icon: 'h-10 w-10' };
const BTN_KIND = {
  primary: 'bg-primary text-primary-foreground hover:bg-primary/90',
  secondary: 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
  outline: 'border border-input bg-background hover:bg-accent hover:text-accent-foreground',
  ghost: 'hover:bg-accent hover:text-accent-foreground',
  destructive: 'bg-destructive text-destructive-foreground hover:bg-destructive/90',
  link: 'text-primary underline-offset-4 hover:underline',
};
const btn = (kind = 'primary', size = 'md', extra = '') => `${BTN_BASE} ${BTN_SIZE[size]} ${BTN_KIND[kind]} ${extra}`;
const INPUT = 'flex h-10 w-full rounded-md border border-input bg-background px-3 text-base md:text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background';

const NAV = [
  { id: 'inicio', label: 'Início', icon: 'home' },
  { id: 'decks', label: 'Decks', icon: 'layers' },
  { id: 'progresso', label: 'Progresso', icon: 'chart' },
  { id: 'config', label: 'Configurações', icon: 'sliders' },
];

function bellMenu() {
  if (S.open !== 'bell') return '';
  return `
  <div class="absolute right-0 top-full z-40 mt-2 w-80 max-w-[calc(100vw-1.5rem)] rounded-lg border bg-popover text-popover-foreground shadow-pop">
    <div class="border-b px-4 py-3 text-sm font-medium">Notificações</div>
    <div class="space-y-1 p-2">
      <div class="flex gap-3 rounded-md bg-accent/70 p-3">
        <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-primary"></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium">Revisão de hoje: <span class="font-mono tnum">17</span> cards</p>
          <p class="text-xs text-muted-foreground"><span class="font-mono tnum">12</span> revisões · <span class="font-mono tnum">5</span> novos · há 2 h</p>
          <div class="mt-3 flex gap-2">
            <button data-act="close" class="${btn('primary', 'sm')}">Começar</button>
            <button data-act="close" class="${btn('ghost', 'sm')}">Marcar como vista</button>
          </div>
        </div>
      </div>
      <div class="flex gap-3 p-3 text-muted-foreground">
        <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-transparent"></span>
        <div><p class="text-sm">Ontem: revisão concluída</p><p class="text-xs">19 de out.</p></div>
      </div>
    </div>
  </div>`;
}

function novoItems() {
  const item = (icon, t, d) => `
    <button data-act="close" class="flex w-full items-start gap-3 rounded-md px-3 py-2.5 text-left hover:bg-accent">
      <span class="mt-0.5 text-muted-foreground">${ic(icon, 'h-4 w-4')}</span>
      <span><span class="block text-sm font-medium">${t}</span><span class="block text-xs text-muted-foreground">${d}</span></span>
    </button>`;
  return item('layers', 'Novo Deck', 'Comece uma coleção nova') + item('plus', 'Adicionar Cards a…', 'Escolha um Deck existente');
}
const novoMenu = () => S.open !== 'novo' ? '' :
  `<div class="absolute right-0 top-full z-40 mt-2 w-64 rounded-lg border bg-popover p-1 text-popover-foreground shadow-pop">${novoItems()}</div>`;

function avatarMenu() {
  if (S.open !== 'avatar') return '';
  return `
  <div class="absolute right-0 top-full z-40 mt-2 w-56 rounded-lg border bg-popover p-1 text-popover-foreground shadow-pop">
    <div class="px-3 py-2"><p class="text-sm font-medium">Ana Souza</p><p class="text-xs text-muted-foreground">ana@exemplo.com</p></div>
    <div class="my-1 h-px bg-border"></div>
    <button data-act="nav:config" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm hover:bg-accent">${ic('sliders', 'h-4 w-4')}Configurações</button>
    <button data-act="close" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm hover:bg-accent">${ic('logout', 'h-4 w-4')}Sair</button>
  </div>`;
}

const pageTitle = () => S.tela === 'catalogo' ? 'Catálogo' : 'Daruma';

/* ---------- shell ---------- */
// título grande no mobile; navegação em pílula centrada; tab bar com indicador em pílula; "+ Novo" estendido
const shell = (content, active) => `
  <div class="min-h-screen">
    <header class="sticky top-0 z-30 bg-background/90 backdrop-blur">
      <div class="mx-auto flex h-16 max-w-5xl items-center gap-4 px-5 md:h-20 md:px-6">
        <h1 class="font-display text-2xl font-semibold md:hidden">${pageTitle()}</h1>
        <a class="hidden items-center gap-2 font-display text-2xl font-semibold tracking-tight text-primary md:inline-flex">${daruma()}Daruma</a>
        <nav class="mx-auto hidden items-center rounded-full bg-muted p-1 text-sm md:flex">
          ${NAV.map((n) => `<button data-act="nav:${n.id}" class="rounded-full px-4 py-1.5 transition ${n.id === active ? 'bg-card font-medium text-foreground shadow-card' : 'text-muted-foreground hover:text-foreground'}">${n.label}</button>`).join('')}
        </nav>
        <div class="ml-auto flex items-center gap-2 md:ml-0">
          <div class="relative hidden md:block" data-keep><button data-act="toggle:novo" class="${btn('primary', 'md')}">${ic('plus', 'h-4 w-4')}Novo</button>${novoMenu()}</div>
          <div class="relative" data-keep>
            <button data-act="toggle:bell" class="relative grid h-10 w-10 place-items-center rounded-full border bg-card hover:bg-accent" aria-label="Notificações">${ic('bell', 'h-[18px] w-[18px]')}<span class="absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full bg-primary ring-2 ring-background"></span></button>${bellMenu()}
          </div>
          <div class="relative hidden md:block" data-keep><button data-act="toggle:avatar" class="grid h-10 w-10 place-items-center rounded-full bg-accent font-display text-sm font-semibold text-accent-foreground">AS</button>${avatarMenu()}</div>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-5xl px-5 pb-36 pt-4 md:px-6 md:pb-16 md:pt-8">${content}</main>
    <nav class="fixed inset-x-0 bottom-0 z-30 bg-card pb-[env(safe-area-inset-bottom)] shadow-[0_-1px_0_hsl(var(--border))] md:hidden">
      <div class="grid grid-cols-4 pb-1 pt-2">
        ${NAV.map((n) => `<button data-act="nav:${n.id}" class="flex flex-col items-center gap-1 text-[11px] font-medium ${n.id === active ? 'text-foreground' : 'text-muted-foreground'}"><span class="grid h-8 w-14 place-items-center rounded-full ${n.id === active ? 'bg-primary/15 text-primary' : ''}">${ic(n.icon)}</span>${n.label}</button>`).join('')}
      </div>
    </nav>
    <button data-act="toggle:novo-sheet" class="fixed bottom-24 right-4 z-30 inline-flex h-12 items-center gap-2 rounded-full bg-primary px-5 text-sm font-semibold text-primary-foreground shadow-pop md:hidden">${ic('plus', 'h-5 w-5')}Novo</button>
  </div>`;

/* ---------- abas ---------- */
function tabs() {
  const items = [['decks', 'Decks'], ['cards', 'Cards']];
  const on = 'rounded-full bg-card px-5 py-1.5 text-sm font-medium shadow-card';
  const off = 'rounded-full px-5 py-1.5 text-sm text-muted-foreground';
  return `<div class="inline-flex rounded-full bg-muted p-1">${items.map(([id, l]) => `<button data-act="tab:${id}" class="${S.tab === id ? on : off}">${l}</button>`).join('')}</div>
  <p class="mt-3 text-sm text-muted-foreground">${S.tab === 'decks' ? 'Lista de Decks.' : 'Todos os Cards, com busca, filtros e seleção em massa.'}</p>`;
}

/* ---------- catálogo ---------- */
const section = (title, desc, body, wide = false) => `
  <section class="min-w-0 space-y-3 ${wide ? 'md:col-span-2' : ''}">
    <div><h2 class="font-display text-lg font-semibold">${title}</h2>${desc ? `<p class="text-sm text-muted-foreground">${desc}</p>` : ''}</div>
    <div class="rounded-lg border bg-card p-4 text-card-foreground shadow-card md:p-6">${body}</div>
  </section>`;
const sub = (t) => `<h3 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">${t}</h3>`;
const chip = (t) => `<span class="inline-flex items-center gap-1 rounded-full border px-2.5 py-0.5 text-xs font-medium">${ic('tag', 'h-3 w-3 text-muted-foreground')}${t}</span>`;
const badge = (t, cls) => `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${cls}">${t}</span>`;
const BADGES = {
  novo: badge('Novo', 'bg-primary/10 text-primary'),
  hoje: badge('Vencido hoje', 'bg-warning/15 text-warning'),
  atrasado: badge('Atrasado', 'bg-destructive/10 text-destructive'),
  agendado: badge('Agendado', 'bg-muted text-muted-foreground'),
};
const TOKENS = [['background', 'Fundo'], ['card', 'Superfície'], ['muted', 'Suave'], ['border', 'Borda'], ['primary', 'Primária'], ['accent', 'Destaque'], ['destructive', 'Erro'], ['warning', 'Aviso'], ['success', 'Sucesso'], ['foreground', 'Texto'], ['muted-foreground', 'Texto de apoio']];

function bloco() {
  if (S.bloco === 'erro') return `
    <div class="flex flex-col items-center justify-center gap-3 rounded-lg border border-dashed p-6 text-center">
      <span class="text-destructive">${ic('alert', 'h-6 w-6')}</span>
      <p class="text-sm">Não foi possível carregar os Decks recentes.</p>
      <button data-act="bloco-retry" class="${btn('outline', 'sm')}">${ic('refresh', 'h-3.5 w-3.5')}Tentar de novo</button>
    </div>`;
  if (S.bloco === 'carregando') return `
    <div class="space-y-4 rounded-lg border p-4" aria-busy="true">
      ${[0, 1, 2].map(() => `<div class="flex items-center gap-3"><div class="h-9 w-9 animate-pulse rounded-md bg-muted"></div><div class="flex-1 space-y-2"><div class="h-3 w-2/3 animate-pulse rounded bg-muted"></div><div class="h-3 w-1/3 animate-pulse rounded bg-muted"></div></div></div>`).join('')}
    </div>`;
  return `
    <div class="divide-y rounded-lg border">
      ${[['Anatomia humana', 42, 8], ['Inglês: phrasal verbs', 120, 15], ['JavaScript', 64, 0]].map(([n, t, d]) => `
        <div class="flex items-center gap-3 p-3"><span class="grid h-9 w-9 place-items-center rounded-md bg-muted text-muted-foreground">${ic('layers', 'h-4 w-4')}</span>
        <div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">${n}</p><p class="text-xs text-muted-foreground"><span class="font-mono tnum">${t}</span> cards · <span class="font-mono tnum">${d}</span> para hoje</p></div></div>`).join('')}
    </div>
    <button data-act="bloco-falha" class="${btn('link', 'sm')} mt-2 px-0">Simular falha de novo</button>`;
}

function catalog() {
  return `
  <div class="space-y-10">
    <div>
      <p class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Protótipo · Catálogo</p>
      <h1 class="mt-1 font-display text-3xl font-semibold tracking-tight">Fundação visual</h1>
      <p class="mt-2 max-w-prose text-muted-foreground">Tokens, componentes base e padrões de erro usados por todas as telas.</p>
    </div>

/* ---------- telas de erro ---------- */
const bigCode = () => '<p class="font-display text-7xl font-bold tracking-tight text-primary">404</p>';

const notFound = () => `
  <div class="mx-auto flex max-w-md flex-col items-center py-16 text-center md:py-24">
    ${bigCode()}
    <h1 class="mt-3 font-display text-2xl font-semibold">Página não encontrada</h1>
    <p class="mt-2 text-muted-foreground">Este Deck ou Card pode ter sido apagado, ou o link está errado.</p>
    <button data-ir="home.html" class="${btn('primary', 'md', 'mt-6')}">Ir para o Início</button>
  </div>`;

const brandBare = () => `<a class="inline-flex items-center gap-2 font-display text-2xl font-semibold tracking-tight text-primary">${daruma()}Daruma</a>`;

const bare404 = () => `
  <div class="flex min-h-screen flex-col">
    <div class="px-5 py-5">${brandBare()}</div>
    <div class="mx-auto flex max-w-md flex-1 flex-col items-center justify-center px-5 pb-24 text-center">
      ${bigCode()}
      <h1 class="mt-3 font-display text-2xl font-semibold">Página não encontrada</h1>
      <p class="mt-2 text-muted-foreground">O link pode estar errado. Entre para ver seus Decks.</p>
      <button data-ir="auth.html" class="${btn('primary', 'md', 'mt-6')}">Entrar</button>
    </div>
  </div>`;

const errorPage = () => `
  <div class="flex min-h-screen flex-col items-center justify-center px-5 pb-24 text-center">
    <span class="grid h-14 w-14 place-items-center rounded-full bg-destructive/10 text-destructive">${ic('alert', 'h-7 w-7')}</span>
    <h1 class="mt-5 font-display text-2xl font-semibold">Algo deu errado</h1>
    <p class="mt-2 max-w-sm text-muted-foreground">Não conseguimos carregar esta página. Tente de novo em alguns segundos.</p>
    <div class="mt-6 flex w-full max-w-xs flex-col gap-2 sm:max-w-none sm:flex-row sm:justify-center">
      <button data-act="page-retry" class="${btn('primary')}" ${S.retrying ? 'disabled' : ''}>${S.retrying ? ic('loader', 'h-4 w-4 animate-spin') + 'Tentando…' : ic('refresh', 'h-4 w-4') + 'Tentar de novo'}</button>
      <button data-ir="home.html" class="${btn('outline')}">Ir para o Início</button>
    </div>
  </div>`;

/* ---------- sobreposições globais ---------- */
function overlays() {
  let out = '';
  if (S.open === 'dialog') out += `
    <div class="fixed inset-0 z-50 grid place-items-center p-4">
      <div class="absolute inset-0 bg-black/50" data-act="close"></div>
      <div data-keep role="dialog" aria-modal="true" class="relative w-full max-w-md rounded-xl border bg-popover p-6 text-popover-foreground shadow-pop">
        <h2 class="font-display text-lg font-semibold">Apagar “Anatomia humana”?</h2>
        <p class="mt-2 text-sm text-muted-foreground">Os 42 Cards deste Deck e os Comments deles serão apagados. Não dá para desfazer.</p>
        <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button data-act="close" class="${btn('outline')}">Cancelar</button>
          <button data-act="dialog-confirm" class="${btn('destructive')}">Apagar Deck</button>
        </div>
      </div>
    </div>`;
  if (S.open === 'novo-sheet') out += `
    <div class="fixed inset-0 z-50 md:hidden">
      <div class="absolute inset-0 bg-black/40" data-act="close"></div>
      <div data-keep class="absolute inset-x-0 bottom-0 rounded-t-xl bg-popover p-3 pb-8 text-popover-foreground shadow-pop">
        <div class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-muted"></div>
        <p class="px-3 pb-2 font-display text-lg font-semibold">Criar</p>
        ${novoItems()}
      </div>
    </div>`;
  return out;
}

function toasts() {
  return `<div class="pointer-events-none fixed inset-x-3 bottom-24 z-[60] flex flex-col gap-2 md:inset-x-auto md:bottom-6 md:right-6 md:w-96" aria-live="polite">
    ${S.toasts.map((t) => `
      <div class="pointer-events-auto flex items-start gap-3 rounded-lg border bg-popover p-4 text-popover-foreground shadow-pop ${t.kind === 'erro' ? 'border-destructive/40' : ''}">
        <span class="${t.kind === 'erro' ? 'text-destructive' : 'text-success'}">${ic(t.kind === 'erro' ? 'alert' : 'ok', 'h-5 w-5')}</span>
        <p class="flex-1 text-sm">${t.msg}</p>
        ${t.retry ? `<button data-act="toast-retry:${t.id}" class="text-sm font-medium text-primary hover:underline">Tentar de novo</button>` : ''}
        <button data-act="toast-close:${t.id}" class="text-muted-foreground hover:text-foreground" aria-label="Fechar">${ic('x', 'h-4 w-4')}</button>
      </div>`).join('')}
  </div>`;
}

function toast(kind, msg, retry = null) {
  const id = ++toastId;
  S.toasts.push({ id, kind, msg, retry });
  setTimeout(() => { S.toasts = S.toasts.filter((t) => t.id !== id); render(); }, 5000);
}

/* ---------- barra do protótipo (fora do design) ---------- */
function switcher() {
  const b = 'grid h-8 w-8 place-items-center rounded-full hover:bg-white/15';
  return `
  <div data-keep class="fixed bottom-[5.5rem] left-3 z-[100] flex items-center gap-1 rounded-full bg-neutral-900 px-1.5 py-1 text-sm text-white shadow-2xl ring-1 ring-white/10 md:bottom-4 md:left-1/2 md:-translate-x-1/2 md:px-2 md:py-1.5" style="font-family:system-ui,sans-serif">
    <select data-sel="tela" class="h-8 rounded-full bg-transparent px-2 hover:bg-white/15" style="color-scheme:dark" aria-label="Tela">
      ${Object.entries(TELAS).map(([k, l]) => `<option value="${k}" ${k === S.tela ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    <button data-act="tema" class="${b}" aria-label="Trocar tema" title="Tema">${ic(S.tema === 'escuro' ? 'moon' : 'sun', 'h-4 w-4')}</button>
    <button data-act="frame" class="${b} hidden md:grid" aria-label="Trocar largura" title="${S.frame === 'mobile' ? 'Ver desktop' : 'Ver mobile (390px)'}">${ic(S.frame === 'mobile' ? 'monitor' : 'phone', 'h-4 w-4')}</button>
  </div>`;
}

/* ---------- render ---------- */
function screen() {
  if (S.tela === '404-deslogado') return bare404() + toasts();
  if (S.tela === 'erro') return errorPage() + toasts();
  const content = S.tela === '404' ? notFound() : catalog();
  return shell(content, S.tela === '404' ? null : S.nav) + overlays() + toasts();
}

function render() {
  const root = document.documentElement;
  root.classList.toggle('dark', S.tema === 'escuro');
  const app = document.getElementById('app');
  if (S.frame === 'mobile' && !S.embed) {
    const src = `?tela=${S.tela}&tema=${S.tema}&embed=1`;
    const frame = app.querySelector('iframe');
    if (!frame || frame.dataset.src !== src) app.innerHTML = `
      <div class="grid min-h-screen place-items-center bg-muted p-6 pb-24">
        <iframe data-src="${src}" src="${src}" title="Mobile 390px" class="h-[844px] max-h-[calc(100vh-7rem)] w-[390px] rounded-[2.25rem] border-[10px] border-neutral-900 bg-background shadow-2xl"></iframe>
      </div>`;
  } else {
    app.innerHTML = screen();
  }
  document.getElementById('switcher').innerHTML = S.embed ? '' : switcher();
  const css = getComputedStyle(root);
  document.querySelectorAll('[data-token]').forEach((el) => { el.textContent = css.getPropertyValue('--' + el.dataset.token).trim(); });
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (S.open && !e.target.closest('[data-keep]')) { S.open = null; render(); }
    return;
  }
  const [k, arg] = el.dataset.act.split(':');
  switch (k) {
    case 'toggle': S.open = S.open === arg ? null : arg; break;
    case 'open': S.open = arg; break;
    case 'close': S.open = null; break;
    case 'nav': S.nav = arg; S.open = null; break;
    case 'tab': S.tab = arg; break;
    case 'switch': S.sw = !S.sw; break;
    case 'toast': arg === 'erro' ? toast('erro', 'Não foi possível salvar o Card.', 'Card salvo.') : toast('ok', 'Card salvo.'); break;
    case 'toast-retry': {
      const t = S.toasts.find((x) => x.id == arg);
      S.toasts = S.toasts.filter((x) => x.id != arg);
      if (t) toast('ok', t.retry);
      break;
    }
    case 'toast-close': S.toasts = S.toasts.filter((x) => x.id != arg); break;
    case 'dialog-confirm': S.open = null; toast('erro', 'Não foi possível apagar o Deck.', 'Deck apagado.'); break;
    case 'bloco-retry': S.bloco = 'carregando'; setTimeout(() => { S.bloco = 'ok'; render(); }, 900); break;
    case 'bloco-falha': S.bloco = 'erro'; break;
    case 'page-retry': S.retrying = true; setTimeout(() => { S.retrying = false; render(); }, 1000); break;
    case 'go': S.tela = arg; S.open = null; syncURL(); break;
    case 'tema': S.tema = S.tema === 'escuro' ? 'claro' : 'escuro'; syncURL(); break;
    case 'frame': S.frame = S.frame === 'mobile' ? 'desktop' : 'mobile'; syncURL(); break;
  }
  render();
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.sel === 'tela') { S.tela = e.target.value; S.open = null; syncURL(); render(); }
});

document.addEventListener('keydown', (e) => {
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) return;
  if (e.key === 'Escape' && S.open) { S.open = null; render(); }
});

syncURL();
render();
</script>
