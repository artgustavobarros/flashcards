<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL — ticket "Telas de login e cadastro".
  Pergunta: como ficam login, cadastro, "esqueci a senha", Google, erros, pós-cadastro e sessão expirada?
  Decisão: e-mail primeiro, numa tela só. O e-mail decide o caminho: senha (conta existe), "esta conta usa o Google"
  ou cadastro (nome + senha). Depois do cadastro a pessoa entra direto; confirmar o e-mail é um aviso, não trava.
  As variantes descartadas (cartão com telas separadas, painel com abas) estão no branch prototype/telas-de-auth.
  Parâmetros: ?tela= (estado inicial) · ?tema=claro|escuro · ?frame=mobile (iframe de 390px).
  Contas de teste: ana@exemplo.com / senha123 entra; google@exemplo.com é conta Google; outro e-mail não tem conta.
  Tokens, botões e alertas vêm de prototype/fundacao-visual.html. Nada é salvo.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login e cadastro · Daruma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Outfit:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="daruma.js"></script>
<script>
  const c = (v) => `hsl(var(--${v}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          border: c('border'), input: c('input'), ring: c('ring'),
          background: c('background'), foreground: c('foreground'),
          card: { DEFAULT: c('card'), foreground: c('card-foreground') },
          popover: { DEFAULT: c('popover'), foreground: c('popover-foreground') },
          primary: { DEFAULT: c('primary'), foreground: c('primary-foreground') },
          secondary: { DEFAULT: c('secondary'), foreground: c('secondary-foreground') },
          muted: { DEFAULT: c('muted'), foreground: c('muted-foreground') },
          accent: { DEFAULT: c('accent'), foreground: c('accent-foreground') },
          destructive: { DEFAULT: c('destructive'), foreground: c('destructive-foreground') },
          success: { DEFAULT: c('success'), foreground: c('success-foreground') },
          warning: { DEFAULT: c('warning'), foreground: c('warning-foreground') },
        },
        borderRadius: {
          sm: 'calc(var(--radius) - 4px)', md: 'calc(var(--radius) - 2px)',
          lg: 'var(--radius)', xl: 'calc(var(--radius) + 4px)', btn: 'var(--radius-btn)',
        },
        fontFamily: { sans: 'var(--font-sans)', display: 'var(--font-display)', mono: 'var(--font-mono)' },
        boxShadow: { card: 'var(--shadow-card)', pop: 'var(--shadow-pop)' },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    * { @apply border-border; }
    body { @apply bg-background text-foreground font-sans antialiased; }
  }
</style>
<style>
  /* Tokens escolhidos (variante B4 · Zinc + verde): neutros do Zinc, verde como cor de ação e de sucesso */
  :root {
    --font-sans: 'DM Sans', system-ui, sans-serif; --font-display: 'Outfit', system-ui, sans-serif; --font-mono: var(--font-sans);
    --radius: .875rem; --radius-btn: 9999px;
    --shadow-card: 0 1px 2px rgb(15 23 42 / .05), 0 6px 20px -6px rgb(15 23 42 / .08);
    --shadow-pop: 0 16px 40px -12px rgb(15 23 42 / .25);
    --background: 0 0% 100%; --foreground: 240 10% 3.9%;
    --card: 0 0% 100%; --card-foreground: 240 10% 3.9%; --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%;
    --primary: 152 42% 32%; --primary-foreground: 0 0% 100%;
    --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
    --destructive: 0 72% 51%; --destructive-foreground: 0 0% 98%;
    --success: 152 42% 32%; --success-foreground: 0 0% 100%;
    --warning: 32 95% 40%; --warning-foreground: 0 0% 100%;
    --border: 240 5.9% 90%; --input: 240 5.9% 88%; --ring: 152 42% 32%;
  }
  .dark {
    --shadow-card: 0 1px 2px rgb(0 0 0 / .3); --shadow-pop: 0 16px 40px -12px rgb(0 0 0 / .7);
    --background: 240 10% 3.9%; --foreground: 0 0% 98%;
    --card: 240 8% 6%; --card-foreground: 0 0% 98%; --popover: 240 8% 7%; --popover-foreground: 0 0% 98%;
    --primary: 148 40% 55%; --primary-foreground: 240 10% 3.9%;
    --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%;
    --destructive: 0 72% 58%; --destructive-foreground: 0 0% 98%;
    --success: 148 40% 55%; --success-foreground: 240 10% 3.9%;
    --warning: 38 92% 55%; --warning-foreground: 240 10% 4%;
    --border: 240 3.7% 15.9%; --input: 240 3.7% 20%; --ring: 148 40% 55%;
  }
  .tnum { font-variant-numeric: tabular-nums; }
</style>
<style>
  /* mobile (moldura ou DevTools): a barra de rolagem do navegador desktop não ocupa largura, como num celular */
  html.embed { scrollbar-width: none; } html.embed::-webkit-scrollbar { display: none; }
  @media (max-width: 767px) { html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; } }
</style>
<script>if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');</script>
</head>
<body>
<div id="app"></div>
<div id="switcher"></div>

<script>
/* ---------- estado ---------- */
const P = new URLSearchParams(location.search);
const TELAS = {
  login: 'Entrar',
  'login-erro': 'Entrar · senha errada',
  'conta-google': 'Entrar · conta do Google',
  'google-erro': 'Entrar · Google falhou',
  'sessao-expirada': 'Sessão expirada',
  cadastro: 'Criar conta',
  'cadastro-erro': 'Criar conta · erros',
  esqueci: 'Esqueci a senha',
  enviado: 'Esqueci · link enviado',
  'nova-senha': 'Nova senha (link do e-mail)',
  'link-expirado': 'Link expirado',
  pos: 'Pós-cadastro',
};
const S = {
  tela: TELAS[P.get('tela')] ? P.get('tela') : 'login',
  tema: P.get('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'),
  frame: P.get('frame') === 'mobile' ? 'mobile' : 'desktop',
  embed: P.get('embed') === '1',
  view: 'login', step: 'email', f: {}, err: {}, alert: null, loading: null, showPw: false,
  from: null, novo: false, unverified: false, reenviado: false, toasts: [],
};
let toastId = 0;

function syncURL() {
  const p = new URLSearchParams({ tela: S.tela, tema: S.tema });
  if (S.frame === 'mobile') p.set('frame', 'mobile');
  if (S.embed) p.set('embed', '1');
  history.replaceState(null, '', '?' + p);
}

/* Cada item do seletor "tela" é um estado inicial pronto; depois a navegação é livre. */
function preset(tela) {
  const ana = 'ana@exemplo.com';
  Object.assign(S, { tela, f: {}, err: {}, alert: null, loading: null, showPw: false, from: null, novo: false, unverified: false, reenviado: false, step: 'email' });
  const to = (view) => { S.view = view; };
  switch (tela) {
    case 'login': to('login'); break;
    case 'login-erro':
      to('login'); S.f = { email: ana, senha: 'senha-errada' }; S.step = 'senha';
      S.alert = { kind: 'erro', title: 'Não foi possível entrar', msg: 'E-mail ou senha incorretos.' };
      break;
    case 'conta-google':
      to('login'); S.f = { email: 'google@exemplo.com' }; S.step = 'google';
      S.alert = { kind: 'info', msg: 'Esta conta foi criada com o Google. Use “Continuar com Google”.' };
      break;
    case 'google-erro':
      to('login');
      S.alert = { kind: 'erro', title: 'Não foi possível entrar com o Google', msg: 'Tente de novo ou use e-mail e senha.' };
      break;
    case 'sessao-expirada':
      to('login'); S.f = { email: ana }; S.step = 'senha'; S.from = 'Anatomia humana';
      S.alert = { kind: 'info', msg: 'Sua sessão expirou. Entre de novo para voltar a “Anatomia humana”.' };
      break;
    case 'cadastro': to('cadastro'); S.step = 'novo'; S.f = { email: 'bia@exemplo.com' }; break;
    case 'cadastro-erro':
      to('cadastro'); S.step = 'novo';
      S.f = { email: 'bia@exemplo.com', senha: '1234' };
      S.err = { nome: 'Informe seu nome.', senha: 'Use pelo menos 8 caracteres.' };
      break;
    case 'esqueci': to('esqueci'); S.f = { email: ana }; break;
    case 'enviado': to('enviado'); S.f = { email: ana }; break;
    case 'nova-senha': to('nova'); break;
    case 'link-expirado': to('expirado'); break;
    case 'pos': S.f = { nome: 'Bia', email: 'bia@exemplo.com' }; posCadastro(); break;
  }
}

/* Depois de criar a conta, entra direto; o e-mail da revisão só sai depois de confirmar. */
function posCadastro() {
  Object.assign(S, { novo: true, view: 'app', unverified: true });
}

/* ---------- ícones (traços estilo lucide) ---------- */
const PATHS = {
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  ok: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-14.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  phone: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
};
const ic = (n, cls = 'h-5 w-5') =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls} shrink-0" aria-hidden="true">${PATHS[n]}</svg>`;
const GOOGLE = `<svg viewBox="0 0 24 24" class="h-[18px] w-[18px] shrink-0" aria-hidden="true">
  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
  <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A10.6 10.6 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- componentes base (iguais à fundação) ---------- */
const BTN_BASE = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-btn font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background disabled:pointer-events-none disabled:opacity-50';
const BTN_SIZE = { sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-6 text-base', icon: 'h-10 w-10' };
const BTN_KIND = {
  primary: 'bg-primary text-primary-foreground hover:bg-primary/90',
  secondary: 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
  outline: 'border border-input bg-background hover:bg-accent hover:text-accent-foreground',
  ghost: 'hover:bg-accent hover:text-accent-foreground',
  link: 'text-primary underline-offset-4 hover:underline',
};
const btn = (kind = 'primary', size = 'md', extra = '') => `${BTN_BASE} ${BTN_SIZE[size]} ${BTN_KIND[kind]} ${extra}`;
const INPUT = 'flex h-11 w-full rounded-md border border-input bg-background px-3 text-base md:text-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background';
const linkCls = 'font-medium text-primary underline-offset-4 hover:underline';

const brand = (cls = 'text-2xl') => `<a class="inline-flex items-center gap-2 font-display ${cls} font-semibold tracking-tight text-primary">${daruma()}Daruma</a>`;

function alertBox() {
  const a = S.alert;
  if (!a) return '';
  const k = {
    erro: ['border-destructive/40 bg-destructive/5', 'text-destructive', 'alert'],
    info: ['bg-muted/50', 'text-muted-foreground', 'info'],
    ok: ['border-success/40 bg-success/5', 'text-success', 'ok'],
  }[a.kind];
  return `<div role="alert" class="flex gap-3 rounded-lg border ${k[0]} p-4 text-sm">
    <span class="${k[1]}">${ic(k[2], 'h-5 w-5')}</span>
    <div>${a.title ? `<p class="font-medium ${k[1]}">${a.title}</p><p class="text-muted-foreground">${a.msg}</p>` : `<p>${a.msg}</p>`}</div>
  </div>`;
}

function field({ id, label, type = 'text', ac = 'off', extra = '', hint = '', autofocus = false }) {
  const err = S.err[id];
  const pw = type === 'password';
  return `<div class="space-y-1.5">
    <div class="flex items-baseline justify-between gap-3"><label for="${id}" class="text-sm font-medium">${label}</label>${extra}</div>
    <div class="relative">
      <input id="${id}" data-f="${id}" type="${pw && S.showPw ? 'text' : type}" autocomplete="${ac}" value="${esc(S.f[id])}" ${autofocus ? 'autofocus' : ''}
        class="${INPUT} ${pw ? 'pr-11' : ''} ${err ? 'border-destructive focus-visible:ring-destructive' : ''}" ${err ? 'aria-invalid="true"' : ''}>
      ${pw ? `<button type="button" data-act="pw" class="absolute inset-y-0 right-0 grid w-11 place-items-center text-muted-foreground hover:text-foreground" aria-label="${S.showPw ? 'Ocultar' : 'Mostrar'} senha">${ic(S.showPw ? 'eyeOff' : 'eye', 'h-4 w-4')}</button>` : ''}
    </div>
    ${err ? `<p class="flex items-center gap-1.5 text-sm text-destructive">${ic('alert', 'h-4 w-4')}<span>${err}</span></p>` : hint ? `<p class="text-xs text-muted-foreground">${hint}</p>` : ''}
  </div>`;
}

const submit = (form, label, busy) => `<button type="submit" class="${btn('primary', 'md', 'h-11 w-full')}" ${S.loading ? 'disabled' : ''}>
  ${S.loading === form ? ic('loader', 'h-4 w-4 animate-spin') + busy : label}</button>`;
const googleBtn = () => `<button type="button" data-act="google" class="${btn('outline', 'md', 'h-11 w-full')}" ${S.loading ? 'disabled' : ''}>
  ${S.loading === 'google' ? ic('loader', 'h-4 w-4 animate-spin') + 'Abrindo o Google…' : GOOGLE + 'Continuar com Google'}</button>`;
const ou = () => `<div class="flex items-center gap-3 text-xs text-muted-foreground"><span class="h-px flex-1 bg-border"></span>ou<span class="h-px flex-1 bg-border"></span></div>`;
const esqueciLink = () => `<button type="button" data-act="go:esqueci" class="text-sm ${linkCls}">Esqueci a senha</button>`;
const termos = () => `<p class="text-xs text-muted-foreground">Ao criar a conta, você aceita os <a class="underline underline-offset-2">Termos</a> e a <a class="underline underline-offset-2">Política de privacidade</a>.</p>`;
const voltarLogin = () => `<button type="button" data-act="go:login" class="inline-flex items-center gap-1.5 text-sm ${linkCls}">${ic('back', 'h-4 w-4')}Voltar para Entrar</button>`;
const h1 = (t, p = '', size = 'text-2xl') => `<div class="space-y-1.5"><h1 class="font-display ${size} font-semibold tracking-tight">${t}</h1>${p ? `<p class="text-muted-foreground">${p}</p>` : ''}</div>`;
const roundIcon = (n, tone = 'primary') => `<span class="grid h-12 w-12 place-items-center rounded-full bg-${tone}/10 text-${tone}">${ic(n, 'h-6 w-6')}</span>`;

/* ---------- redefinição de senha ---------- */
function esqueciView() {
  return `<div class="space-y-6">
    ${h1('Redefinir senha', 'Informe o e-mail da conta. Enviamos um link para criar uma senha nova.')}
    <form data-form="esqueci" class="space-y-4" novalidate>
      ${field({ id: 'email', label: 'E-mail', type: 'email', ac: 'email' })}
      ${submit('esqueci', 'Enviar link', 'Enviando…')}
    </form>
    ${voltarLogin()}
  </div>`;
}

function enviadoView() {
  return `<div class="space-y-6">
    ${roundIcon('mail')}
    ${h1('Confira seu e-mail', `Se houver uma conta com <span class="font-medium text-foreground">${esc(S.f.email)}</span>, o link chega em alguns minutos. Olhe também o spam.`)}
    <div class="flex flex-col gap-2">
      <button data-act="reenviar" class="${btn('outline', 'md', 'h-11 w-full')}" ${S.reenviado ? 'disabled' : ''}>${S.reenviado ? ic('clock', 'h-4 w-4') + 'Reenviar em 60 s' : 'Reenviar link'}</button>
      <button data-act="go:nova-senha" class="${btn('ghost', 'md', 'h-11 w-full text-muted-foreground')}">Abrir o link do e-mail (simulação)</button>
    </div>
    ${voltarLogin()}
  </div>`;
}

function novaView() {
  return `<div class="space-y-6">
    ${h1('Crie uma senha nova', `Para a conta <span class="font-medium text-foreground">ana@exemplo.com</span>.`)}
    <form data-form="nova" class="space-y-4" novalidate>
      ${field({ id: 'senha', label: 'Senha nova', type: 'password', ac: 'new-password', hint: 'Pelo menos 8 caracteres.' })}
      ${submit('nova', 'Salvar senha', 'Salvando…')}
    </form>
  </div>`;
}

function expiradoView() {
  return `<div class="space-y-6">
    ${roundIcon('clock', 'warning')}
    ${h1('Este link expirou', 'Links de redefinição valem por 1 hora e só funcionam uma vez. Peça outro.')}
    <button data-act="go:esqueci" class="${btn('primary', 'md', 'h-11 w-full')}">Pedir outro link</button>
    ${voltarLogin()}
  </div>`;
}

const extraViews = { esqueci: esqueciView, enviado: enviadoView, nova: novaView, expirado: expiradoView };

/* ---------- e-mail primeiro: uma tela só que se ramifica ---------- */
const emailChip = () => `
  <button type="button" data-act="trocar" class="inline-flex max-w-full items-center gap-2 rounded-full border px-3 py-1.5 text-sm hover:bg-accent">
    ${ic('mail', 'h-4 w-4 text-muted-foreground')}<span class="truncate">${esc(S.f.email)}</span><span class="font-medium text-primary">Trocar</span>
  </button>`;

function authScreen() {
  let inner;
  if (S.view === 'login' && S.step === 'email') {
    inner = `
      ${h1('Entre ou crie sua conta', 'Use seu e-mail ou sua conta Google.', 'text-3xl')}
      ${alertBox()}
      ${googleBtn()}${ou()}
      <form data-form="email" class="space-y-4" novalidate>
        ${field({ id: 'email', label: 'E-mail', type: 'email', ac: 'email', autofocus: !S.embed })}
        ${submit('email', 'Continuar', 'Verificando…')}
      </form>`;
  } else if (S.view === 'login' && S.step === 'google') {
    inner = `
      ${emailChip()}
      ${h1('Esta conta usa o Google', 'Ela foi criada com “Continuar com Google” e não tem senha.', 'text-3xl')}
      ${googleBtn()}`;
  } else if (S.view === 'login') {
    inner = `
      ${emailChip()}
      ${h1('Digite sua senha', '', 'text-3xl')}
      ${alertBox()}
      <form data-form="login" class="space-y-4" novalidate>
        ${field({ id: 'senha', label: 'Senha', type: 'password', ac: 'current-password', extra: esqueciLink(), autofocus: !S.embed })}
        ${submit('login', 'Entrar', 'Entrando…')}
      </form>`;
  } else if (S.view === 'cadastro') {
    inner = `
      ${emailChip()}
      ${h1('Criar sua conta', 'Ainda não há conta com este e-mail.', 'text-3xl')}
      <form data-form="cadastro" class="space-y-4" novalidate>
        ${field({ id: 'nome', label: 'Nome', ac: 'given-name' })}
        ${field({ id: 'senha', label: 'Senha', type: 'password', ac: 'new-password', hint: 'Pelo menos 8 caracteres.' })}
        ${submit('cadastro', 'Criar conta', 'Criando conta…')}
        ${termos()}
      </form>`;
  } else inner = extraViews[S.view]();
  return `
  <div class="flex min-h-screen flex-col">
    <header class="px-5 py-5 md:px-10">${brand()}</header>
    <main class="flex flex-1 justify-center px-5 pb-28 pt-6 md:items-center md:pt-0">
      <div class="w-full max-w-md space-y-6">${inner}</div>
    </main>
  </div>`;
}

/* ---------- depois de entrar: as telas reais do protótipo ---------- */
// sessão expirada volta ao Deck onde estava; conta nova cai no Início vazio (com o aviso de e-mail se não confirmou)
function irApp() {
  if (S.from) return ir('decks.html?tela=deck&deck=anatomia');
  if (S.novo) return ir(`home.html?dados=vazio&email=${S.unverified ? 'pendente' : 'ok'}`);
  ir('home.html');
}

/* ---------- toasts (iguais à fundação, sem tab bar embaixo) ---------- */
function toasts() {
  return `<div class="pointer-events-none fixed inset-x-3 bottom-20 z-[60] flex flex-col gap-2 md:inset-x-auto md:bottom-6 md:right-6 md:w-96" aria-live="polite">
    ${S.toasts.map((t) => `
      <div class="pointer-events-auto flex items-start gap-3 rounded-lg border bg-popover p-4 text-popover-foreground shadow-pop ${t.kind === 'erro' ? 'border-destructive/40' : ''}">
        <span class="${t.kind === 'erro' ? 'text-destructive' : 'text-success'}">${ic(t.kind === 'erro' ? 'alert' : 'ok', 'h-5 w-5')}</span>
        <p class="flex-1 text-sm">${t.msg}</p>
        <button data-act="toast-close:${t.id}" class="text-muted-foreground hover:text-foreground" aria-label="Fechar">${ic('x', 'h-4 w-4')}</button>
      </div>`).join('')}
  </div>`;
}
function toast(kind, msg) {
  const id = ++toastId;
  S.toasts.push({ id, kind, msg });
  setTimeout(() => { S.toasts = S.toasts.filter((t) => t.id !== id); render(); }, 5000);
}

/* ---------- barra do protótipo (fora do design) ---------- */
function switcher() {
  const b = 'grid h-8 w-8 place-items-center rounded-full hover:bg-white/15';
  return `
  <div class="fixed bottom-3 left-1/2 z-[100] flex -translate-x-1/2 flex-col items-center gap-1.5" style="font-family:system-ui,sans-serif">
    <p class="hidden rounded-full bg-neutral-900/90 px-3 py-1 text-[11px] text-white/80 md:block">Teste: ana@exemplo.com / senha123 · google@exemplo.com = conta Google · outro e-mail = sem conta</p>
    <div class="flex items-center gap-1 rounded-full bg-neutral-900 px-1.5 py-1 text-sm text-white shadow-2xl ring-1 ring-white/10">
      <select data-sel="tela" class="h-8 max-w-[9.5rem] rounded-full bg-transparent px-2 hover:bg-white/15 sm:max-w-none" style="color-scheme:dark" aria-label="Estado">
        ${Object.entries(TELAS).map(([k, l]) => `<option value="${k}" ${k === S.tela ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <button data-act="tema" class="${b}" aria-label="Trocar tema">${ic(S.tema === 'escuro' ? 'moon' : 'sun', 'h-4 w-4')}</button>
      <button data-act="frame" class="${b} hidden md:grid" aria-label="Trocar largura" title="${S.frame === 'mobile' ? 'Ver desktop' : 'Ver mobile (390px)'}">${ic(S.frame === 'mobile' ? 'monitor' : 'phone', 'h-4 w-4')}</button>
    </div>
  </div>`;
}

/* ---------- render ---------- */
function screen() {
  if (S.view === 'app') { irApp(); return ''; }
  return authScreen() + toasts();
}

function render() {
  const root = document.documentElement;
  root.classList.toggle('dark', S.tema === 'escuro');
  const app = document.getElementById('app');
  if (S.frame === 'mobile' && !S.embed) {
    const src = `?tela=${S.tela}&tema=${S.tema}&embed=1`;
    const frame = app.querySelector('iframe');
    if (!frame || frame.dataset.src !== src) app.innerHTML = `
      <div class="grid min-h-screen place-items-center bg-muted p-6 pb-28">
        <iframe data-src="${src}" src="${src}" title="Mobile 390px" class="h-[844px] max-h-[calc(100vh-8rem)] w-[390px] rounded-[2.25rem] border-[10px] border-neutral-900 bg-background shadow-2xl"></iframe>
      </div>`;
  } else {
    app.innerHTML = screen();
  }
  document.getElementById('switcher').innerHTML = S.embed ? '' : switcher();
}

/* ---------- regras falsas de conta ---------- */
const EMAIL_OK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const later = (ms, fn) => setTimeout(() => { S.loading = null; fn(); render(); }, ms);
const entrar = () => { S.view = 'app'; };

function onSubmit(form) {
  const f = S.f;
  S.err = {};
  if (form === 'email' || form === 'esqueci') {
    if (!f.email) S.err.email = 'Informe seu e-mail.';
    else if (!EMAIL_OK.test(f.email)) S.err.email = 'Informe um e-mail válido.';
  }
  if (form === 'login' && !f.senha) S.err.senha = 'Informe sua senha.';
  if (form === 'cadastro' || form === 'nova') {
    if (!f.senha || f.senha.length < 8) S.err.senha = 'Use pelo menos 8 caracteres.';
    if (form === 'cadastro' && !f.nome) S.err.nome = 'Informe seu nome.';
  }
  if (Object.keys(S.err).length) return render();

  S.loading = form;
  S.alert = S.from ? S.alert : null;
  render();
  const email = (f.email || '').toLowerCase();
  switch (form) {
    case 'email':
      return later(600, () => {
        if (email === 'ana@exemplo.com') S.step = 'senha';
        else if (email === 'google@exemplo.com') S.step = 'google';
        else { S.view = 'cadastro'; S.step = 'novo'; }
      });
    case 'login':
      return later(700, () => {
        if (email === 'ana@exemplo.com' && f.senha === 'senha123') return entrar();
        if (email === 'google@exemplo.com') S.alert = { kind: 'info', msg: 'Esta conta foi criada com o Google. Use “Continuar com Google”.' };
        else S.alert = { kind: 'erro', title: 'Não foi possível entrar', msg: 'E-mail ou senha incorretos.' };
        S.f.senha = '';
      });
    case 'cadastro': return later(800, posCadastro);
    case 'esqueci': return later(700, () => { S.view = 'enviado'; });
    case 'nova':
      return later(700, () => {
        S.view = 'login'; S.step = 'senha'; S.f = { email: 'ana@exemplo.com' };
        S.alert = { kind: 'ok', msg: 'Senha alterada. Entre com a senha nova.' };
      });
  }
}

function go(tela) {
  const keepEmail = S.f.email;
  preset(tela);
  if (keepEmail && (tela === 'esqueci' || tela === 'login')) S.f.email = keepEmail;
  syncURL();
}

document.addEventListener('submit', (e) => {
  const form = e.target.dataset.form;
  if (!form) return;
  e.preventDefault();
  onSubmit(form);
});

document.addEventListener('input', (e) => {
  const k = e.target.dataset.f;
  if (k) S.f[k] = e.target.value;
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const [k, arg] = el.dataset.act.split(':');
  switch (k) {
    case 'go': go(arg); break;
    case 'pw': S.showPw = !S.showPw; break;
    case 'trocar': S.view = 'login'; S.step = 'email'; S.alert = null; S.err = {}; break;
    case 'google':
      S.loading = 'google'; S.alert = null; render();
      return later(900, () => { if (S.view === 'cadastro') { S.f.nome = 'Bia'; S.novo = true; } entrar(); });
    case 'reenviar': S.reenviado = true; toast('ok', 'E-mail reenviado.'); break;
    case 'sair': preset('login'); syncURL(); break;
    case 'toast-close': S.toasts = S.toasts.filter((x) => x.id != arg); break;
    case 'tema': S.tema = S.tema === 'escuro' ? 'claro' : 'escuro'; syncURL(); break;
    case 'frame': S.frame = S.frame === 'mobile' ? 'desktop' : 'mobile'; syncURL(); break;
  }
  render();
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.sel === 'tela') { preset(e.target.value); syncURL(); render(); }
});

preset(S.tela);
syncURL();
render();
</script>
</body>
